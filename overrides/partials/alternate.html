{# Direct two-language switch. The i18n plugin supplies page-matched URLs. #}
{% set current_locale = page.file.locale if page else "en" %}
{% for alt in config.extra.alternate %}
  {% if alt.lang != current_locale %}
    <div class="md-header__option lc-language-switch">
      <a
        class="md-header__button lc-language-switch__button"
        href="{{ alt.link | url }}"
        hreflang="{{ alt.lang }}"
        lang="{{ alt.lang }}"
        aria-label="{{ 'Switch to English' if alt.lang == 'en' else 'ປ່ຽນເປັນພາສາລາວ' }}"
        title="{{ 'Switch to English' if alt.lang == 'en' else 'ປ່ຽນເປັນພາສາລາວ' }}"
      >
        {% if alt.lang == "en" %}
          <svg class="lc-language-switch__flag" viewBox="0 0 38 24" role="img" aria-hidden="true">
            <rect width="38" height="24" rx="2" fill="#fff"/>
            <path fill="#b22234" d="M0 0h38v2H0zm0 4h38v2H0zm0 4h38v2H0zm0 4h38v2H0zm0 4h38v2H0zm0 4h38v2H0z"/>
            <path fill="#3c3b6e" d="M0 0h16v14H0z"/>
            <g fill="#fff">
              <circle cx="2" cy="2" r=".65"/><circle cx="6" cy="2" r=".65"/><circle cx="10" cy="2" r=".65"/><circle cx="14" cy="2" r=".65"/>
              <circle cx="4" cy="5" r=".65"/><circle cx="8" cy="5" r=".65"/><circle cx="12" cy="5" r=".65"/>
              <circle cx="2" cy="8" r=".65"/><circle cx="6" cy="8" r=".65"/><circle cx="10" cy="8" r=".65"/><circle cx="14" cy="8" r=".65"/>
              <circle cx="4" cy="11" r=".65"/><circle cx="8" cy="11" r=".65"/><circle cx="12" cy="11" r=".65"/>
            </g>
          </svg>
        {% else %}
          <svg class="lc-language-switch__flag" viewBox="0 0 38 24" role="img" aria-hidden="true">
            <rect width="38" height="24" rx="2" fill="#ce1126"/>
            <rect y="6" width="38" height="12" fill="#002868"/>
            <circle cx="19" cy="12" r="4.6" fill="#fff"/>
          </svg>
        {% endif %}
      </a>
    </div>
  {% endif %}
{% endfor %}
