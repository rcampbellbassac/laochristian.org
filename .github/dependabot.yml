version: 2
updates:
  # Site build dependencies (mkdocs, mkdocs-material, plugins) and
  # content-generation tooling (scripts/, not part of the deployed site).
  # Only "/" is listed: Dependabot's pip ecosystem discovers requirements
  # files repo-wide from "/", so it already picks up scripts/requirements.txt.
  # Listing "/scripts" as well (as a second entry or in `directories`)
  # produces duplicate PRs for every scripts/requirements.txt bump.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # Pinned actions in .github/workflows/deploy-pages.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
