version: 2
updates:
  # Site build dependencies (mkdocs, mkdocs-material, plugins) and
  # content-generation tooling (scripts/, not part of the deployed site).
  # One entry with `directories` (not two separate `directory` entries) --
  # Dependabot's pip ecosystem discovers requirements files repo-wide
  # rather than strictly scoping to each `directory`, so two entries here
  # produced duplicate PRs for the same scripts/requirements.txt bump.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/scripts"
    schedule:
      interval: "weekly"

  # Pinned actions in .github/workflows/deploy-pages.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
